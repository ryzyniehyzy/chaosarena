<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Chaos Arena Online</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
    <style>
        body, html {
            margin: 0; padding: 0; width: 100%; height: 100%;
            background-color: #0f0f13; overflow: hidden;
            font-family: 'Press Start 2P', cursive; color: #fff;
            user-select: none; -webkit-user-select: none;
        }
        
        #gameCanvas {
            position: absolute; top: 0; left: 0;
            width: 100%; height: 100%; display: none;
            z-index: 10;
        }

        .crt::before {
            content: " "; display: block; position: absolute;
            top: 0; left: 0; bottom: 0; right: 0;
            background: linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.25) 50%), linear-gradient(90deg, rgba(255, 0, 0, 0.06), rgba(0, 255, 0, 0.02), rgba(0, 0, 255, 0.06));
            z-index: 100; background-size: 100% 2px, 3px 100%; pointer-events: none;
        }

        .ui-layer {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            z-index: 50; display: flex; align-items: center; justify-content: center;
            pointer-events: none;
        }

        .interactive { pointer-events: auto; }
        .screen { display: none; }
        .screen.active { display: flex; }

        .pixel-box {
            background-color: #1a1a24; border: 4px solid #fff;
            box-shadow: 8px 8px 0px 0px rgba(0,0,0,0.8);
            pointer-events: auto;
        }

        .btn {
            background-color: #ff3366; border: 4px solid #fff;
            box-shadow: inset -4px -4px 0px 0px rgba(0,0,0,0.4);
            color: white; text-transform: uppercase; cursor: pointer;
            transition: transform 0.1s;
        }
        .btn:hover { background-color: #ff5c85; }
        .btn:active { box-shadow: inset 4px 4px 0px 0px rgba(0,0,0,0.4); transform: translateY(4px); }
        .btn:disabled { background-color: #555; color: #888; cursor: not-allowed; }

        .input-pixel {
            background-color: #2a2a35; border: 4px solid #fff;
            color: #fff; outline: none; font-family: inherit;
        }
        .input-pixel:focus { border-color: #00e5ff; }

        ::-webkit-scrollbar { width: 8px; }
        ::-webkit-scrollbar-track { background: #1a1a24; border-left: 2px solid #fff; }
        ::-webkit-scrollbar-thumb { background: #fff; }

        #chatBox {
            position: absolute; bottom: 20px; left: 20px; width: 350px;
            z-index: 60; pointer-events: auto; display: none;
            background: rgba(0,0,0,0.7); border: 2px solid #fff;
        }
        
        #hud {
            position: absolute; top: 20px; right: 20px;
            z-index: 60; pointer-events: none; display: none;
            text-shadow: 2px 2px 0 #000;
        }
    </style>
</head>
<body class="crt">

    <canvas id="gameCanvas"></canvas>

    <div id="uiContainer" class="ui-layer interactive">
        <!-- MENU SCREEN -->
        <div id="screen-menu" class="screen active flex-col gap-6 p-8 pixel-box max-w-md w-full text-center">
            <h1 class="text-4xl text-[#00e5ff] mb-2 leading-tight" style="text-shadow: 4px 4px 0 #ff3366;">CHAOS<br>ARENA</h1>
            
            <div class="flex flex-col gap-2 text-left">
                <label class="text-[10px] text-gray-400">Pseudonim:</label>
                <input type="text" id="playerName" value="Paweł Pyka" class="input-pixel p-3 text-sm w-full text-center" maxlength="15">
            </div>

            <div class="flex flex-col gap-2 text-left">
                <label class="text-[10px] text-gray-400">Kolor postaci:</label>
                <input type="color" id="playerColor" value="#00e5ff" class="w-full h-10 cursor-pointer border-4 border-white bg-black">
            </div>

            <div class="flex flex-col gap-4 mt-4">
                <button id="btnCreateRoom" class="btn p-4 text-xs w-full">STWÓRZ POKÓJ</button>
                <div class="flex gap-2">
                    <input type="text" id="joinCode" placeholder="KOD" class="input-pixel p-4 w-1/2 text-center uppercase" maxlength="6">
                    <button id="btnJoinRoom" class="btn p-4 text-xs w-1/2 !bg-[#00e5ff] hover:!bg-[#66edff] !text-black">DOŁĄCZ</button>
                </div>
            </div>
            
            <p id="menuError" class="text-xs text-red-500 mt-2 hidden"></p>
        </div>

        <!-- LOBBY SCREEN -->
        <div id="screen-lobby" class="screen flex-col gap-6 p-8 pixel-box max-w-2xl w-full">
            <div class="flex justify-between items-center border-b-4 border-white pb-4">
                <h2 class="text-2xl text-[#00e5ff]">LOBBY</h2>
                <div class="text-right">
                    <span class="text-[10px] text-gray-400 block">KOD POKOJU:</span>
                    <span id="lobbyCode" class="text-3xl text-[#ff3366] tracking-widest font-bold">------</span>
                </div>
            </div>

            <div class="flex gap-6">
                <div class="w-1/2 flex flex-col gap-2">
                    <label class="text-[10px] text-gray-400">Gracze (<span id="playerCount">1</span>/12):</label>
                    <ul id="playerList" class="bg-black/50 border-2 border-gray-600 h-48 overflow-y-auto p-2 flex flex-col gap-2 text-xs"></ul>
                </div>
                
                <div class="w-1/2 flex flex-col gap-4">
                    <div class="flex flex-col gap-2">
                        <label class="text-[10px] text-gray-400">Tryb Gry (Tylko Host):</label>
                        <select id="gameModeSelect" class="input-pixel p-3 text-xs w-full cursor-pointer disabled:opacity-50">
                            <option value="lms">🛡️ Last Man Standing</option>
                            <option value="race">🏁 Wyścig Chaosu</option>
                            <option value="capture">🟢 Łapanie Punktów</option>
                            <option value="koth">👑 King of the Hill</option>
                            <option value="survival">🔴 Mini Games Party (Survival)</option>
                        </select>
                    </div>
                    
                    <p id="hostWarning" class="text-[9px] text-yellow-400 hidden">Czekaj aż Host wystartuje grę...</p>
                    
                    <div class="flex-grow flex items-end">
                        <button id="btnStartGame" class="btn p-4 text-xs w-full !bg-[#00cc44] hover:!bg-[#33ff77] hidden">ROZPOCZNIJ GRĘ</button>
                    </div>
                </div>
            </div>
            
            <button id="btnLeaveLobby" class="btn p-3 text-[10px] w-1/3 !bg-gray-600 mt-2">Wyjdź</button>
        </div>

        <!-- END SCREEN -->
        <div id="screen-end" class="screen flex-col gap-6 p-8 pixel-box max-w-md w-full text-center">
            <h2 class="text-3xl text-yellow-400 mb-4">KONIEC GRY</h2>
            <div id="winnerName" class="text-xl text-white mb-6"></div>
            
            <div class="text-left text-xs mb-2">Tabela Wyników:</div>
            <ul id="endLeaderboard" class="bg-black/50 border-2 border-white h-40 overflow-y-auto p-4 flex flex-col gap-3 text-xs text-left mb-4"></ul>

            <button id="btnReturnLobby" class="btn p-4 text-xs w-full hidden">WRÓĆ DO LOBBY (HOST)</button>
            <p id="endWaitMsg" class="text-[10px] text-gray-400">Czekaj aż Host przywróci pokój...</p>
        </div>
    </div>

    <!-- IN-GAME HUD -->
    <div id="hud" class="flex flex-col items-end gap-4">
        <div class="bg-black/60 border-2 border-white p-4 min-w-[200px]">
            <div id="hudTime" class="text-2xl text-center text-yellow-400 mb-2">00:00</div>
            <div id="hudModeName" class="text-[10px] text-gray-300 text-center border-b border-gray-600 pb-2 mb-2">Tryb</div>
            <ul id="hudLeaderboard" class="flex flex-col gap-1 text-[10px]"></ul>
        </div>
        <button id="btnLeaveGame" class="btn p-2 text-[10px] !bg-red-700 interactive">OPUŚĆ GRĘ</button>
    </div>

    <!-- CHAT BOX -->
    <div id="chatBox" class="flex flex-col h-48">
        <div id="chatMessages" class="flex-grow overflow-y-auto p-2 text-[9px] flex flex-col gap-1 bg-black/80"></div>
        <form id="chatForm" class="flex border-t-2 border-white">
            <input type="text" id="chatInput" placeholder="Napisz..." class="bg-transparent text-white p-2 text-[10px] flex-grow outline-none font-mono">
            <button type="submit" class="bg-white text-black p-2 text-[10px] cursor-pointer">WYŚLIJ</button>
        </form>
    </div>

    <!-- FATAL ERROR MODAL -->
    <div id="errorModal" class="hidden fixed top-0 left-0 w-full h-full bg-black/90 flex items-center justify-center z-[100] p-4 interactive">
        <div class="pixel-box p-6 max-w-lg text-center bg-red-900 !border-red-500">
            <h2 class="text-xl text-white mb-4">⚠️ BŁĄD POŁĄCZENIA!</h2>
            <p id="errorMsg" class="text-xs text-red-200 mb-6 leading-relaxed font-mono text-left bg-black p-4 overflow-auto max-h-40"></p>
            <button onclick="document.getElementById('errorModal').classList.add('hidden')" class="btn p-3 w-full !bg-gray-800">ZAMKNIJ</button>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
        import { getAuth, signInAnonymously } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js";
        import { getDatabase, ref, set, get, update, remove, onValue, onDisconnect } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-database.js";

        const firebaseConfig = {
            apiKey: "AIzaSyCr-idnk4Nrol2615W0Jf62oajJJkTdpks",
            authDomain: "chaosarena-75404.firebaseapp.com",
            databaseURL: "https://chaosarena-75404-default-rtdb.firebaseio.com/",
            projectId: "chaosarena-75404",
            storageBucket: "chaosarena-75404.firebasestorage.app",
            messagingSenderId: "24436364546",
            appId: "1:24436364546:web:9793a5e85d4734195f9e1b",
            measurementId: "G-PR43K57SFX"
        };

        function showError(msg) {
            document.getElementById('errorMsg').innerText = msg;
            document.getElementById('errorModal').classList.remove('hidden');
            console.error(msg);
        }

        let app, db, auth;
        try {
            app = initializeApp(firebaseConfig);
            db = getDatabase(app);
            auth = getAuth(app);
        } catch(e) {
            showError("Błąd inicjalizacji Firebase: " + e.message);
        }

        let userId = null;
        let currentRoomId = null;
        let isHost = false;
        
        let roomUnsubscribe = null;
        let playersUnsubscribe = null;

        const localState = {
            name: "Paweł Pyka",
            color: "#00e5ff",
            x: 1000, y: 1000,
            vx: 0, vy: 0,
            score: 0,
            isDead: false,
            lastSync: 0
        };

        let remotePlayers = {}; 
        let globalGameState = {
            status: 'lobby',
            mode: 'lms',
            timer: 0,
            safeZone: null,
            zones: [],
            kothZone: null,
            balls: [],
            winner: null
        };

        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        const ARENA_WIDTH = 2000;
        const ARENA_HEIGHT = 2000;
        let camera = { x: 0, y: 0 };
        let gameLoopId = null;
        let hostLogicInterval = null;
        let syncInterval = null;
        const keys = { w: false, a: false, s: false, d: false, ArrowUp: false, ArrowLeft: false, ArrowDown: false, ArrowRight: false };

        async function authenticate() {
            if (userId) return true;
            try {
                const result = await signInAnonymously(auth);
                userId = result.user.uid;
                return true;
            } catch (err) {
                showError("Błąd autoryzacji anonimowej Firebase: " + err.message + "\nUpewnij się, że włączyłeś Anonymous w konsoli Firebase Auth!");
                return false;
            }
        }

        function generateRoomCode() {
            const chars = 'ABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789';
            let code = '';
            for (let i = 0; i < 6; i++) code += chars.charAt(Math.floor(Math.random() * chars.length));
            return code;
        }

        async function createRoom() {
            document.getElementById('menuError').classList.add('hidden');
            localState.name = document.getElementById('playerName').value || "Paweł Pyka";
            localState.color = document.getElementById('playerColor').value || "#00e5ff";
            
            if (!await authenticate()) return;

            currentRoomId = generateRoomCode();
            isHost = true;

            try {
                const roomRef = ref(db, `rooms/${currentRoomId}`);
                await set(roomRef, {
                    hostId: userId,
                    status: 'lobby',
                    mode: 'lms',
                    timer: 60,
                    stateData: "{}"
                });
                
                onDisconnect(roomRef).remove();
                await joinPlayerToRoom();
                showLobby();
            } catch(e) {
                showError("Nie można utworzyć pokoju. Sprawdź reguły bazy danych Realtime Database: " + e.message);
            }
        }

        async function joinRoomBtn() {
            const code = document.getElementById('joinCode').value.toUpperCase().trim();
            if(code.length !== 6) {
                const err = document.getElementById('menuError');
                err.innerText = "Kod musi mieć 6 znaków!"; err.classList.remove('hidden');
                return;
            }

            localState.name = document.getElementById('playerName').value || "Gracz";
            localState.color = document.getElementById('playerColor').value || "#ff3366";

            if (!await authenticate()) return;

            try {
                const roomRef = ref(db, `rooms/${code}`);
                const snapshot = await get(roomRef);
                
                if (snapshot.exists()) {
                    currentRoomId = code;
                    isHost = false;
                    await joinPlayerToRoom();
                    showLobby();
                } else {
                    showError("Pokój o takim kodzie nie istnieje!");
                }
            } catch(e) {
                showError("Błąd dołączania do pokoju: " + e.message);
            }
        }

        async function joinPlayerToRoom() {
            const playerRef = ref(db, `room_players/${currentRoomId}/${userId}`);
            await set(playerRef, {
                id: userId,
                name: localState.name,
                color: localState.color,
                x: localState.x, y: localState.y,
                vx: 0, vy: 0,
                score: 0,
                isDead: false,
                ts: Date.now()
            });
            
            onDisconnect(playerRef).remove();
            listenToRoom();
            listenToPlayers();
        }

        function listenToRoom() {
            if (roomUnsubscribe) roomUnsubscribe();
            const roomRef = ref(db, `rooms/${currentRoomId}`);
            
            roomUnsubscribe = onValue(roomRef, (snapshot) => {
                if (!snapshot.exists()) {
                    leaveRoom(true); 
                    return;
                }
                const data = snapshot.val();
                
                if (data.stateData) {
                    try { Object.assign(globalGameState, JSON.parse(data.stateData)); } 
                    catch(e){}
                }
                
                globalGameState.timer = data.timer;
                globalGameState.mode = data.mode;

                if (globalGameState.status !== data.status) {
                    globalGameState.status = data.status;
                    if (data.status === 'playing') startGameClient();
                    else if (data.status === 'ended') showEndScreen();
                    else if (data.status === 'lobby') showLobby();
                }

                if (globalGameState.status === 'lobby' && !isHost) {
                    document.getElementById('gameModeSelect').value = data.mode;
                }
            }, (error) => console.error(error));
        }

        function listenToPlayers() {
            if (playersUnsubscribe) playersUnsubscribe();
            const playersRef = ref(db, `room_players/${currentRoomId}`);
            
            playersUnsubscribe = onValue(playersRef, (snapshot) => {
                const playersData = snapshot.val() || {};
                const activeInRoom = [];
                
                Object.values(playersData).forEach(data => {
                    activeInRoom.push(data);

                    if (data.id !== userId) {
                        if (!remotePlayers[data.id]) {
                            remotePlayers[data.id] = { ...data, targetX: data.x, targetY: data.y };
                        } else {
                            const rp = remotePlayers[data.id];
                            rp.name = data.name; rp.color = data.color;
                            rp.score = data.score; rp.isDead = data.isDead;
                            rp.targetX = data.x; rp.targetY = data.y;
                            rp.vx = data.vx; rp.vy = data.vy;
                        }
                    } else if (globalGameState.status === 'playing') {
                        localState.score = data.score;
                        if (data.isDead && !localState.isDead) {
                            localState.isDead = true;
                        }
                    }
                });

                const activeIds = new Set(activeInRoom.map(p => p.id));
                Object.keys(remotePlayers).forEach(id => {
                    if (!activeIds.has(id)) delete remotePlayers[id];
                });

                updatePlayerListUI(activeInRoom);
            }, (error) => console.error(error));
        }

        async function syncLocalPlayer() {
            if (!userId || !currentRoomId) return;
            const now = Date.now();
            if (now - localState.lastSync < 50) return;
            localState.lastSync = now;

            const playerRef = ref(db, `room_players/${currentRoomId}/${userId}`);
            try {
                await update(playerRef, {
                    x: Math.round(localState.x), 
                    y: Math.round(localState.y),
                    vx: Math.round(localState.vx), 
                    vy: Math.round(localState.vy),
                    ts: Date.now()
                });
            } catch(e) {}
        }

        function switchScreen(id) {
            document.querySelectorAll('.screen').forEach(el => el.classList.remove('active'));
            document.getElementById('uiContainer').classList.add('interactive');
            if(id) document.getElementById(id).classList.add('active');
        }

        function showLobby() {
            switchScreen('screen-lobby');
            document.getElementById('lobbyCode').innerText = currentRoomId;
            document.getElementById('chatBox').style.display = 'flex';
            canvas.style.display = 'none';
            document.getElementById('hud').style.display = 'none';

            const modeSelect = document.getElementById('gameModeSelect');
            const startBtn = document.getElementById('btnStartGame');
            const hostWarn = document.getElementById('hostWarning');

            if (isHost) {
                modeSelect.disabled = false;
                startBtn.style.display = 'block';
                hostWarn.style.display = 'none';
                
                modeSelect.onchange = async (e) => {
                    await update(ref(db, `rooms/${currentRoomId}`), { mode: e.target.value });
                };
            } else {
                modeSelect.disabled = true;
                startBtn.style.display = 'none';
                hostWarn.style.display = 'block';
            }
        }

        function updatePlayerListUI(players) {
            const count = players.length;
            document.getElementById('playerCount').innerText = count;
            
            const list = document.getElementById('playerList');
            const hudLeader = document.getElementById('hudLeaderboard');
            if(!list || !hudLeader) return;

            players.sort((a,b) => b.score - a.score);

            if (globalGameState.status === 'lobby' || globalGameState.status === 'ended') {
                list.innerHTML = players.map(p => `
                    <li class="flex items-center gap-2 p-1 ${p.id===userId?'bg-white/10':''}">
                        <div class="w-4 h-4" style="background-color:${p.color}"></div>
                        <span class="flex-grow">${p.name} ${p.id===userId?'(TY)':''}</span>
                        <span class="text-yellow-400 font-bold">${p.score} pkt</span>
                    </li>
                `).join('');
            }

            if (globalGameState.status === 'playing') {
                hudLeader.innerHTML = players.map(p => `
                    <li class="flex justify-between w-full ${p.isDead ? 'opacity-50 line-through' : ''} ${p.id===userId?'text-white font-bold':'text-gray-300'}">
                        <span><span style="color:${p.color}">■</span> ${p.name.substring(0,8)}</span>
                        <span>${p.score}</span>
                    </li>
                `).join('');
            }

            if (globalGameState.status === 'ended') {
                document.getElementById('endLeaderboard').innerHTML = players.map((p, index) => `
                    <li class="flex justify-between items-center bg-black/40 p-2 border border-gray-600">
                        <span>#${index+1} <span style="color:${p.color}">■</span> ${p.name}</span>
                        <span class="text-yellow-400">${p.score} pkt</span>
                    </li>
                `).join('');
            }
        }

        async function leaveRoom(kicked = false) {
            if (userId && currentRoomId) {
                try { await remove(ref(db, `room_players/${currentRoomId}/${userId}`)); } catch(e){}
            }
            if (isHost && currentRoomId) {
                try { await remove(ref(db, `rooms/${currentRoomId}`)); } catch(e){}
            }
            
            if (roomUnsubscribe) roomUnsubscribe();
            if (playersUnsubscribe) playersUnsubscribe();
            
            clearInterval(syncInterval);
            clearInterval(hostLogicInterval);
            cancelAnimationFrame(gameLoopId);
            
            currentRoomId = null; isHost = false; remotePlayers = {};
            
            canvas.style.display = 'none';
            document.getElementById('hud').style.display = 'none';
            document.getElementById('chatBox').style.display = 'none';
            switchScreen('screen-menu');
            
            if (kicked) showError("Pokój został zamknięty lub połączenie zostało przerwane.");
        }

        class HostEngine {
            constructor() {
                this.state = {
                    safeZone: { x: 1000, y: 1000, r: 1000 },
                    zones: [],
                    kothZone: { x: 1000, y: 1000, r: 200 },
                    balls: []
                };
                this.timer = 60;
                this.tickRate = 100;
            }

            initMode(mode) {
                this.state = { safeZone: null, zones: [], kothZone: null, balls: [] };
                if (mode === 'lms') {
                    this.timer = 60;
                    this.state.safeZone = { x: 1000, y: 1000, r: 1200 };
                } else if (mode === 'race') {
                    this.timer = 45;
                } else if (mode === 'capture') {
                    this.timer = 60;
                    for(let i=0; i<3; i++) this.spawnZone();
                } else if (mode === 'koth') {
                    this.timer = 60;
                    this.state.kothZone = { x: 1000, y: 1000, r: 250 };
                } else if (mode === 'survival') {
                    this.timer = 60;
                    for(let i=0; i<15; i++) {
                        this.state.balls.push({
                            x: 500 + Math.random()*1000, y: 500 + Math.random()*1000,
                            vx: (Math.random()-0.5)*15, vy: (Math.random()-0.5)*15, r: 25
                        });
                    }
                }
            }

            spawnZone() {
                this.state.zones.push({
                    x: 200 + Math.random() * 1600,
                    y: 200 + Math.random() * 1600,
                    r: 100
                });
            }

            async tick() {
                if (globalGameState.status !== 'playing') return;

                const mode = globalGameState.mode;
                const updates = {};
                let aliveCount = 0;
                let lastAliveName = "";

                const allPlayers = [{id: userId, ...localState}];
                Object.keys(remotePlayers).forEach(id => {
                    allPlayers.push({id, ...remotePlayers[id]});
                });

                if (mode === 'lms') {
                    this.state.safeZone.r -= (this.tickRate / 1000) * 15; 
                    if(this.state.safeZone.r < 50) this.state.safeZone.r = 50;
                    
                    allPlayers.forEach(p => {
                        if (p.isDead) return;
                        aliveCount++; lastAliveName = p.name;
                        const dist = Math.hypot(p.x - this.state.safeZone.x, p.y - this.state.safeZone.y);
                        if (dist > this.state.safeZone.r) {
                            updates[`${p.id}/isDead`] = true;
                        }
                    });
                    if (aliveCount <= 1 && allPlayers.length > 1) this.timer = 0;

                } else if (mode === 'race') {
                    allPlayers.forEach(p => {
                        if (p.isDead) return;
                        if (p.x > 1900) { 
                            updates[`${p.id}/score`] = p.score + 100;
