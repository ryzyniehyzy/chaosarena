<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Paweł Pyka: ZOMBIE SURVIVAL</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
    <style>
        body, html { margin: 0; padding: 0; width: 100%; height: 100%; background-color: #050505; overflow: hidden; font-family: 'Press Start 2P', monospace; user-select: none; }
        #gameCanvas { position: absolute; top: 0; left: 0; z-index: 10; cursor: crosshair; }
        
        .ui-layer { position: absolute; top: 0; left: 0; width: 100%; height: 100%; z-index: 50; display: flex; align-items: center; justify-content: center; pointer-events: none; }
        .screen { display: none; flex-direction: column; align-items: center; justify-content: center; background: rgba(0, 0, 0, 0.85); width: 100%; height: 100%; pointer-events: auto; backdrop-filter: blur(4px); }
        .screen.active { display: flex; }
        
        .panel { background-color: #1a1a24; border: 4px solid #fff; box-shadow: 8px 8px 0px 0px rgba(0,0,0,1); padding: 2rem; max-width: 600px; width: 90%; text-align: center; }
        .btn { background-color: #ff3366; border: 4px solid #fff; box-shadow: inset -4px -4px 0px 0px rgba(0,0,0,0.4); color: white; padding: 1rem 2rem; text-transform: uppercase; cursor: pointer; transition: transform 0.1s; font-family: inherit; font-size: 14px; margin-top: 1rem;}
        .btn:hover { background-color: #ff5c85; }
        .btn:active { box-shadow: inset 4px 4px 0px 0px rgba(0,0,0,0.4); transform: translateY(4px); }
        
        .upgrade-card { background: #222; border: 2px solid #555; padding: 1rem; margin: 0.5rem; cursor: pointer; transition: all 0.2s; width: 30%; }
        .upgrade-card:hover { border-color: #00e5ff; transform: translateY(-5px); background: #2a2a35; }
        
        #hud { position: absolute; top: 20px; left: 20px; z-index: 40; color: white; text-shadow: 2px 2px 0 #000; pointer-events: none; display: none; }
        .bar-container { width: 200px; height: 20px; border: 2px solid #fff; background: #333; margin-top: 10px; }
        #healthBar { height: 100%; background: #ff3366; width: 100%; transition: width 0.2s; }
        
        .crt::before { content: " "; display: block; position: absolute; top: 0; left: 0; bottom: 0; right: 0; background: linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.25) 50%), linear-gradient(90deg, rgba(255, 0, 0, 0.06), rgba(0, 255, 0, 0.02), rgba(0, 0, 255, 0.06)); z-index: 100; background-size: 100% 2px, 3px 100%; pointer-events: none; opacity: 0.5; }
    </style>
</head>
<body class="crt">

    <canvas id="gameCanvas"></canvas>

    <div id="hud">
        <div id="waveText" class="text-xl mb-2 text-[#00e5ff]">FALA 1</div>
        <div id="scoreText" class="text-sm">Punkty: 0</div>
        <div class="bar-container"><div id="healthBar"></div></div>
    </div>

    <div id="uiContainer" class="ui-layer">
        
        <!-- MENU GŁÓWNE -->
        <div id="screen-menu" class="screen active">
            <div class="panel">
                <h1 class="text-3xl text-white mb-2 leading-tight">Paweł Pyka</h1>
                <h2 class="text-xl text-[#ff3366] mb-8">ZOMBIE SURVIVAL</h2>
                <p class="text-xs text-gray-400 mb-6 leading-loose">
                    STEROWANIE:<br>
                    [W A S D] / [Strzałki] - Poruszanie się<br>
                    [Myszka] - Celowanie<br>
                    [LPM] - Strzelanie
                </p>
                <button class="btn" onclick="Game.start()">ROZPOCZNIJ RZEŹ</button>
            </div>
        </div>

        <!-- ULEPSZENIA (MIĘDZY FALAMI) -->
        <div id="screen-upgrades" class="screen">
            <div class="panel !max-w-4xl">
                <h2 class="text-2xl text-[#00e5ff] mb-2">FALA POKONANA!</h2>
                <p class="text-xs text-gray-300 mb-6">Wybierz ulepszenie sprzętu:</p>
                <div class="flex justify-between" id="upgradeOptions">
                    <!-- Generowane z JS -->
                </div>
            </div>
        </div>

        <!-- KONIEC GRY -->
        <div id="screen-gameover" class="screen">
            <div class="panel">
                <h2 class="text-3xl text-[#ff3366] mb-4">ZGON</h2>
                <p class="text-sm text-gray-300 mb-2">Przetrwano fal: <span id="finalWave" class="text-white"></span></p>
                <p class="text-sm text-gray-300 mb-6">Punkty: <span id="finalScore" class="text-white"></span></p>
                <button class="btn" onclick="location.reload()">ZAGRAJ PONOWNIE</button>
            </div>
        </div>

    </div>

    <script>
        // --- FUNKCJA, KTÓREJ ZABRAKŁO (Przełączanie ekranów) ---
        function switchScreen(id) {
            document.querySelectorAll('.screen').forEach(el => el.classList.remove('active'));
            if(id) {
                document.getElementById(id).classList.add('active');
            }
        }

        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        let width, height;

        function resize() {
            width = window.innerWidth;
            height = window.innerHeight;
            canvas.width = width;
            canvas.height = height;
        }
        window.addEventListener('resize', resize);
        resize();

        // --- WEJŚCIE (INPUT) ---
        const Input = {
            keys: {},
            mouse: { x: 0, y: 0, worldX: 0, worldY: 0, isDown: false },
            init() {
                window.addEventListener('keydown', e => this.keys[e.code] = true);
                window.addEventListener('keyup', e => this.keys[e.code] = false);
                window.addEventListener('mousemove', e => {
                    this.mouse.x = e.clientX;
                    this.mouse.y = e.clientY;
                });
                window.addEventListener('mousedown', () => this.mouse.isDown = true);
                window.addEventListener('mouseup', () => this.mouse.isDown = false);
            }
        };

        // --- KAMERA ---
        const Camera = {
            x: 0, y: 0, shakeTime: 0, shakeIntensity: 0,
            update(dt, target) {
                // Płynne podążanie za graczem (Lerp)
                this.x += ((target.x - width / 2) - this.x) * 5 * dt;
                this.y += ((target.y - height / 2) - this.y) * 5 * dt;
                
                // Aktualizacja pozycji myszy w świecie gry
                Input.mouse.worldX = Input.mouse.x + this.x;
                Input.mouse.worldY = Input.mouse.y + this.y;

                if (this.shakeTime > 0) {
                    this.shakeTime -= dt;
                }
            },
            shake(intensity, duration) {
                this.shakeIntensity = intensity;
                this.shakeTime = duration;
            },
            apply(context) {
                context.save();
                let ox = 0, oy = 0;
                if (this.shakeTime > 0) {
                    ox = (Math.random() - 0.5) * this.shakeIntensity;
                    oy = (Math.random() - 0.5) * this.shakeIntensity;
                }
                context.translate(-this.x + ox, -this.y + oy);
            },
            clear(context) {
                context.restore();
            }
        };

        // --- SYSTEM CZĄSTECZEK (KREW) ---
        const Particles = {
            list: [], bloodDecals: [],
            spawn(x, y, color, count, speed, life, size) {
                for(let i=0; i<count; i++) {
                    const angle = Math.random() * Math.PI * 2;
                    const v = Math.random() * speed;
                    this.list.push({
                        x: x, y: y,
                        vx: Math.cos(angle) * v, vy: Math.sin(angle) * v,
                        color: color, size: Math.random() * size + 2,
                        life: life, maxLife: life,
                        friction: 0.95
                    });
                }
            },
            update(dt) {
                for(let i = this.list.length - 1; i >= 0; i--) {
                    let p = this.list[i];
                    p.x += p.vx * dt * 60;
                    p.y += p.vy * dt * 60;
                    p.vx *= p.friction;
                    p.vy *= p.friction;
                    p.life -= dt;
                    
                    if (p.life <= 0) {
                        // Krew zostaje na ziemi (Decals)
                        if (p.color === '#cc0000') {
                            this.bloodDecals.push({x: p.x, y: p.y, size: p.size, a: Math.random() * Math.PI*2});
                            if(this.bloodDecals.length > 500) this.bloodDecals.shift();
                        }
                        this.list.splice(i, 1);
                    }
                }
            },
            drawGround(ctx) {
                ctx.fillStyle = '#660000';
                this.bloodDecals.forEach(b => {
                    ctx.save(); ctx.translate(b.x, b.y); ctx.rotate(b.a);
                    ctx.fillRect(-b.size/2, -b.size/2, b.size, b.size);
                    ctx.restore();
                });
            },
            draw(ctx) {
                this.list.forEach(p => {
                    ctx.fillStyle = p.color;
                    ctx.globalAlpha = p.life / p.maxLife;
                    ctx.fillRect(p.x - p.size/2, p.y - p.size/2, p.size, p.size);
                });
                ctx.globalAlpha = 1;
            }
        };

        // --- LATAJĄCE LICZBY OBRAŻEŃ ---
        const FloatingText = {
            list: [],
            spawn(x, y, text, color, isCrit) {
                this.list.push({
                    x: x + (Math.random()*20-10), y: y - 20, 
                    text: text, color: color, 
                    life: 0.8, maxLife: 0.8, 
                    vy: -50, size: isCrit ? 16 : 10
                });
            },
            update(dt) {
                for(let i = this.list.length - 1; i >= 0; i--) {
                    let t = this.list[i];
                    t.y += t.vy * dt;
                    t.life -= dt;
                    if (t.life <= 0) this.list.splice(i, 1);
                }
            },
            draw(ctx) {
                ctx.textAlign = 'center';
                this.list.forEach(t => {
                    ctx.fillStyle = t.color;
                    ctx.globalAlpha = Math.max(0, t.life / t.maxLife);
                    ctx.font = `${t.size}px "Press Start 2P"`;
                    ctx.fillText(t.text, t.x, t.y);
                });
                ctx.globalAlpha = 1;
            }
        };

        // --- KLASY ---
        class Player {
            constructor() {
                this.x = 1000; this.y = 1000;
                this.radius = 18;
                this.speed = 250;
                this.hp = 100; this.maxHp = 100;
                this.angle = 0;
                
                // Statystyki Broni
                this.fireRate = 0.2; // s między strzałami
                this.fireTimer = 0;
                this.damage = 25;
                this.projectiles = 1; // domyślnie 1 pocisk
                this.spread = 0.1;
                
                this.muzzleFlash = 0;
            }

            update(dt) {
                if (this.hp <= 0) return;

                // Ruch (wsparcie dla klawiszy WASD oraz Strzałek)
                let mx = 0, my = 0;
                if (Input.keys['KeyW'] || Input.keys['ArrowUp']) my -= 1;
                if (Input.keys['KeyS'] || Input.keys['ArrowDown']) my += 1;
                if (Input.keys['KeyA'] || Input.keys['ArrowLeft']) mx -= 1;
                if (Input.keys['KeyD'] || Input.keys['ArrowRight']) mx += 1;

                if (mx !== 0 && my !== 0) {
                    let len = Math.hypot(mx, my);
                    mx /= len; my /= len;
                }

                this.x += mx * this.speed * dt;
                this.y += my * this.speed * dt;

                // Obrót do myszki
                this.angle = Math.atan2(Input.mouse.worldY - this.y, Input.mouse.worldX - this.x);

                // Strzelanie
                if (this.fireTimer > 0) this.fireTimer -= dt;
                if (this.muzzleFlash > 0) this.muzzleFlash -= dt;

                if (Input.mouse.isDown && this.fireTimer <= 0) {
                    this.shoot();
                }
            }

            shoot() {
                this.fireTimer = this.fireRate;
                this.muzzleFlash = 0.05;
                Camera.shake(4, 0.1); // Screen shake!

                // Odrzut (Knockback z broni)
                this.x -= Math.cos(this.angle) * 5;
                this.y -= Math.sin(this.angle) * 5;

                // Wystrzel pociski (jeśli masz upgrade na Strzelbę to leci więcej)
                for(let i=0; i < this.projectiles; i++) {
                    let spreadAngle = this.angle;
                    if(this.projectiles > 1) {
                        spreadAngle += (Math.random() - 0.5) * this.spread;
                    }
                    Game.bullets.push(new Bullet(this.x, this.y, spreadAngle, this.damage));
                }

                // Cząsteczki łuski wypadającej z broni
                Particles.spawn(this.x, this.y, '#e6b800', 1, 100, 0.5, 3);
            }

            draw(ctx) {
                ctx.save();
                ctx.translate(this.x, this.y);
                ctx.rotate(this.angle);

                // Cień
                ctx.fillStyle = 'rgba(0,0,0,0.5)';
                ctx.fillRect(-15, -15, 30, 30);

                // Muzzle Flash
                if (this.muzzleFlash > 0) {
                    ctx.fillStyle = 'rgba(255, 255, 100, 0.8)';
                    ctx.beginPath(); ctx.arc(35, 8, 15 + Math.random()*10, 0, Math.PI*2); ctx.fill();
                    ctx.fillStyle = '#fff';
                    ctx.beginPath(); ctx.arc(35, 8, 5, 0, Math.PI*2); ctx.fill();
                }

                // Ręce i broń
                ctx.fillStyle = '#ffccaa'; // skóra
                ctx.fillRect(5, -14, 10, 8); // lewa ręka
                ctx.fillRect(15, 4, 10, 8);  // prawa ręka
                ctx.fillStyle = '#333'; // broń
                ctx.fillRect(10, 6, 25, 6);

                // Tułów (Niebieska koszula Pawła)
                ctx.fillStyle = '#0055ff';
                ctx.fillRect(-12, -12, 24, 24);
                
                // Głowa / Czapka
                ctx.fillStyle = '#222'; // daszek
                ctx.fillRect(0, -6, 16, 12);
                ctx.fillStyle = '#ff3366'; // czapka góra
                ctx.fillRect(-8, -8, 16, 16);

                ctx.restore();
            }
        }

        class Bullet {
            constructor(x, y, angle, damage) {
                this.x = x + Math.cos(angle) * 20; 
                this.y = y + Math.sin(angle) * 20;
                this.vx = Math.cos(angle) * 1200;
                this.vy = Math.sin(angle) * 1200;
                this.damage = damage;
                this.life = 1.0;
                this.oldX = this.x; this.oldY = this.y;
            }

            update(dt) {
                this.oldX = this.x; this.oldY = this.y;
                this.x += this.vx * dt;
                this.y += this.vy * dt;
                this.life -= dt;
            }

            draw(ctx) {
                ctx.strokeStyle = '#ffff00';
                ctx.lineWidth = 2;
                ctx.beginPath();
                ctx.moveTo(this.oldX, this.oldY);
                ctx.lineTo(this.x, this.y);
                ctx.stroke();
            }
        }

        class Zombie {
            constructor(x, y, hp, speed) {
                this.x = x; this.y = y;
                this.radius = 16;
                this.hp = hp;
                this.maxHp = hp;
                this.speed = speed;
                this.angle = 0;
                this.hitTimer = 0;
            }

            update(dt, player) {
                if (this.hitTimer > 0) this.hitTimer -= dt;

                this.angle = Math.atan2(player.y - this.y, player.x - this.x);
                
                // Podejdź do gracza jeśli nie dostałeś właśnie strzała (odrzut)
                if (this.hitTimer <= 0) {
                    this.x += Math.cos(this.angle) * this.speed * dt;
                    this.y += Math.sin(this.angle) * this.speed * dt;
                } else {
                    // Knockback do tyłu
                    this.x -= Math.cos(this.angle) * (this.speed * 1.5) * dt;
                    this.y -= Math.sin(this.angle) * (this.speed * 1.5) * dt;
                }

                // Ugryzienie gracza
                let dist = Math.hypot(player.x - this.x, player.y - this.y);
                if (dist < this.radius + player.radius) {
                    player.hp -= 15 * dt; // wysysa 15 hp na sekundę z bliska
                }
            }

            takeDamage(amt, angle) {
                let isCrit = Math.random() < 0.2; // 20% szansy na krytyka
                let finalDmg = isCrit ? amt * 2 : amt;
                
                this.hp -= finalDmg;
                this.hitTimer = 0.15; // Czas trwania odrzutu wroga
                
                FloatingText.spawn(this.x, this.y, Math.round(finalDmg), isCrit ? '#ffff00' : '#fff', isCrit);
                Particles.spawn(this.x, this.y, '#cc0000', 8, 200, 0.4, 4); // Cząsteczki krwi
            }

            draw(ctx) {
                ctx.save();
                ctx.translate(this.x, this.y);
                ctx.rotate(this.angle);

                // Cień
                ctx.fillStyle = 'rgba(0,0,0,0.5)';
                ctx.beginPath(); ctx.arc(0, 0, this.radius, 0, Math.PI*2); ctx.fill();

                // Kolor zależy od otrzymywanych obrażeń (miga na biało przy trafieniu)
                ctx.fillStyle = this.hitTimer > 0 ? '#ffffff' : '#33cc33';

                // Wyciągnięte łapska
                ctx.fillRect(5, -15, 12, 6);
                ctx.fillRect(5, 9, 12, 6);

                // Ciało i obwódka
                ctx.beginPath(); ctx.arc(0, 0, 12, 0, Math.PI*2); ctx.fill();
                ctx.strokeStyle = '#115511'; ctx.lineWidth = 2; ctx.stroke();

                // Czerwone Oczy
                ctx.fillStyle = '#ff0000';
                ctx.fillRect(6, -6, 4, 4);
                ctx.fillRect(6, 2, 4, 4);

                ctx.restore();
            }
        }

        // --- GŁÓWNA LOGIKA GRY ---
        const Game = {
            state: 'MENU',
            player: null,
            bullets: [],
            zombies: [],
            
            wave: 1,
            zombiesToSpawn: 0,
            spawnTimer: 0,
            score: 0,
            
            lastTime: 0,

            start() {
                // Wywołanie wcześniej brakującej funkcji!
                switchScreen(null);
                document.getElementById('hud').style.display = 'block';

                Input.init();
                this.player = new Player();
                this.bullets = [];
                this.zombies = [];
                Particles.list = [];
                Particles.bloodDecals = [];
                FloatingText.list = [];
                this.wave = 1;
                this.score = 0;
                this.startWave();
                
                this.state = 'PLAYING';
                this.lastTime = performance.now();
                requestAnimationFrame(t => this.loop(t));
            },

            startWave() {
                this.zombiesToSpawn = 10 + (this.wave * 5); // Więcej zombiaków z każdą falą
                this.spawnTimer = 0;
                document.getElementById('waveText').innerText = `FALA ${this.wave}`;
            },

            spawnZombie() {
                let angle = Math.random() * Math.PI * 2;
                let dist = Math.max(width, height) / 2 + 100; // Poza ekranem
                let zx = this.player.x + Math.cos(angle) * dist;
                let zy = this.player.y + Math.sin(angle) * dist;
                
                let hp = 40 + (this.wave * 10);
                let speed = 80 + (this.wave * 5);
                
                this.zombies.push(new Zombie(zx, zy, hp, speed));
            },

            checkCollisions() {
                for (let i = this.bullets.length - 1; i >= 0; i--) {
                    let b = this.bullets[i];
                    let hit = false;
                    for (let j = this.zombies.length - 1; j >= 0; j--) {
                        let z = this.zombies[j];
                        if (Math.hypot(b.x - z.x, b.y - z.y) < z.radius) {
                            z.takeDamage(b.damage, Math.atan2(b.vy, b.vx));
                            if (z.hp <= 0) {
                                this.zombies.splice(j, 1);
                                this.score += 10;
                            }
                            hit = true;
                            break;
                        }
                    }
                    if (hit) {
                        Particles.spawn(b.x, b.y, '#ffffaa', 3, 100, 0.2, 2); // Iskry po uderzeniu kuli
                        this.bullets.splice(i, 1);
                    }
                }
            },

            update(dt) {
                if (this.state !== 'PLAYING') return;

                this.player.update(dt);
                Camera.update(dt, this.player);

                // Algorytm wypuszczania fal przeciwników
                if (this.zombiesToSpawn > 0) {
                    this.spawnTimer -= dt;
                    if (this.spawnTimer <= 0) {
                        this.spawnZombie();
                        this.zombiesToSpawn--;
                        this.spawnTimer = Math.max(0.2, 1.5 - (this.wave * 0.1)); // Szybszy spawn na wyższych falach
                    }
                } else if (this.zombies.length === 0) {
                    // Koniec Fali - Przejście do Upgrade'ów
                    this.state = 'UPGRADE';
                    this.showUpgrades();
                }

                // Aktualizacja wszystkich bytów
                this.bullets.forEach((b, i) => { b.update(dt); if(b.life <= 0) this.bullets.splice(i, 1); });
                this.zombies.forEach(z => z.update(dt, this.player));
                Particles.update(dt);
                FloatingText.update(dt);
                
                this.checkCollisions();

                // UI Update (Pasek zdrowia)
                document.getElementById('healthBar').style.width = Math.max(0, (this.player.hp / this.player.maxHp) * 100) + '%';
                document.getElementById('scoreText').innerText = `Punkty: ${this.score}`;

                // Wykrywanie Śmierci
                if (this.player.hp <= 0) {
                    this.state = 'GAMEOVER';
                    document.getElementById('finalWave').innerText = this.wave;
                    document.getElementById('finalScore').innerText = this.score;
                    document.getElementById('hud').style.display = 'none';
                    switchScreen('screen-gameover');
                }
            },

            draw() {
                // Tło (czarna pusta strefa)
                ctx.fillStyle = '#0a0a0f';
                ctx.fillRect(0, 0, width, height);

                Camera.apply(ctx);

                // Rysowanie kratek na ziemi dla poczucia ruchu
                ctx.strokeStyle = '#15151a'; ctx.lineWidth = 2;
                const grid = 100;
                const sx = Math.floor(Camera.x/grid)*grid, sy = Math.floor(Camera.y/grid)*grid;
                ctx.beginPath();
                for(let x=sx; x<Camera.x+width+grid; x+=grid) { ctx.moveTo(x, sy); ctx.lineTo(x, sy+height+grid*2); }
                for(let y=sy; y<Camera.y+height+grid; y+=grid) { ctx.moveTo(sx, y); ctx.lineTo(sx+width+grid*2, y); }
                ctx.stroke();

                // Krew i resztki
                Particles.drawGround(ctx);
                
                // Elementy
                this.bullets.forEach(b => b.draw(ctx));
                this.zombies.forEach(z => z.draw(ctx));
                this.player.draw(ctx);
                Particles.draw(ctx);
                FloatingText.draw(ctx);

                Camera.clear(ctx);

                // Oświetlenie wokół bohatera jak z latarki (Vignette)
                if (this.state === 'PLAYING') {
                    const gradient = ctx.createRadialGradient(
                        width/2, height/2, 50, // Środek gracza jasny
                        width/2, height/2, 600 // Krawędź ekranu ciemna
                    );
                    gradient.addColorStop(0, 'rgba(0,0,0,0)');
                    gradient.addColorStop(1, 'rgba(0,0,0,0.9)');
                    
                    ctx.fillStyle = gradient;
                    ctx.fillRect(0, 0, width, height);
                }
            },

            loop(time) {
                // Delta time = czas od ostatniej klatki ułamkach sekund
                const dt = Math.min((time - this.lastTime) / 1000, 0.1); 
                this.lastTime = time;

                if (this.state === 'PLAYING') {
                    this.update(dt);
                    this.draw();
                }
                
                // Utrzymuj pętlę aktywną, o ile nie wróciliśmy do głównego menu
                if (this.state !== 'MENU') {
                    requestAnimationFrame(t => this.loop(t));
                }
            },

            // --- MENU ULEPSZEŃ ---
            showUpgrades() {
                switchScreen('screen-upgrades');
                document.getElementById('hud').style.display = 'none';

                const options = [
                    { name: "SZYBKIE PALCE", desc: "Zwiększa szybkostrzelność", action: () => this.player.fireRate *= 0.75 },
                    { name: "WIĘKSZY KALIBER", desc: "Zwiększa obrażenia kul o 50%", action: () => this.player.damage += 15 },
                    { name: "LEKKIE BUTY", desc: "Biegasz o 20% szybciej", action: () => this.player.speed *= 1.2 },
                    { name: "APTECZKA", desc: "Leczy 50 HP i zwiększa Max HP", action: () => { this.player.maxHp += 20; this.player.hp = Math.min(this.player.hp + 50, this.player.maxHp); } },
                    { name: "STRZELBA", desc: "Wystrzeliwuje dodatkowy pocisk z boku", action: () => { this.player.projectiles += 1; this.player.spread += 0.05; } }
                ];

                // Wymieszaj tablicę (żeby po każdej fali losowało)
                options.sort(() => 0.5 - Math.random());
                const choices = options.slice(0, 3); // Wybierz 3 górne po wymieszaniu
                
                const container = document.getElementById('upgradeOptions');
                container.innerHTML = ''; // Wyczyść stare karty
                
                choices.forEach(c => {
                    const div = document.createElement('div');
                    div.className = 'upgrade-card';
                    div.innerHTML = `<h3 class="text-[10px] text-yellow-400 mb-2">${c.name}</h3><p class="text-[8px] text-gray-300 leading-relaxed">${c.desc}</p>`;
                    div.onclick = () => {
                        c.action();
                        this.wave++;
                        this.startWave();
                        switchScreen(null);
                        document.getElementById('hud').style.display = 'block';
                        this.state = 'PLAYING';
                    };
                    container.appendChild(div);
                });
            }
        };

    </script>
</body>
</html>
